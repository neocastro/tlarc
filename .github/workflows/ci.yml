name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  toolchain:
    name: tla2tools.jar fetch + JVM smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # M0.2: the pinned jar must download and pass checksum verification.
      - run: ./scripts/fetch-tla2tools.sh
      # Smoke: the jar must actually run on the CI JDK.
      - run: java -cp bridge/lib/tla2tools.jar tlc2.TLC -help >/dev/null 2>&1 || true
        # (M0.3 replaces the `|| true` with a real bridge invocation.)
