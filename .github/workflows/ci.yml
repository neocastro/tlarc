name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Provision the bridge toolchain so the M0.5 e2e tests run for real.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./scripts/fetch-tla2tools.sh
      - run: javac -cp bridge/lib/tla2tools.jar -d bridge/target/classes bridge/src/SanyJson.java
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  toolchain:
    name: tla2tools.jar fetch + JVM smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Cache the pinned jar. The key is the fetch script's hash, which
      # changes exactly when VERSION or SHA256 is bumped, so a pin change
      # invalidates the cache and re-downloads; otherwise we skip the fetch.
      - uses: actions/cache@v4
        with:
          path: bridge/lib/tla2tools.jar
          key: tla2tools-${{ hashFiles('scripts/fetch-tla2tools.sh') }}
      # M0.2: the pinned jar must download and pass checksum verification.
      # On a cache hit, fetch-tla2tools.sh no-ops (checksum already valid).
      - run: ./scripts/fetch-tla2tools.sh
      # M0.3: the bridge must compile and emit a schema-valid document.
      - run: javac -cp bridge/lib/tla2tools.jar -d bridge/target/classes bridge/src/SanyJson.java
      - run: java -cp bridge/lib/tla2tools.jar:bridge/target/classes SanyJson corpus/trivial.tla | python3 -c "import json,sys; json.load(sys.stdin); print('bridge JSON valid')"
